name: Validate lesson content

on:
  pull_request:
    paths:
      - "src/data/lessonExtras.ts"
      - "src/data/lessons/courses/**"
      - "src/data/curriculum.ts"
      - "scripts/validate-lessons.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "src/data/lessonExtras.ts"
      - "src/data/lessons/courses/**"
      - "src/data/curriculum.ts"
      - "scripts/validate-lessons.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Validate lesson catalog
        run: node scripts/validate-lessons.mjs
